{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<h1>Fusca Beer — entrar</h1>
<form id="login" method="post" action="/login/" class="cartao">
  {% csrf_token %}
  {% if form.errors %}<ul class="mensagens"><li class="erro">Usuário ou senha incorretos.</li></ul>{% endif %}
  <label for="id_username">Usuário</label>
  <input id="id_username" name="username" autocomplete="username" autocapitalize="none" required value="{{ form.username.value|default:'' }}">
  <label for="id_password">Senha</label>
  <input id="id_password" name="password" type="password" autocomplete="current-password" required>
  <input type="hidden" name="next" value="{{ next }}">
  <p><button class="primario largo">Entrar</button></p>
</form>
{% endblock %}
