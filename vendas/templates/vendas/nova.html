{% extends "base.html" %}
{% block titulo %}Nova venda{% endblock %}
{% block conteudo %}
<h1>Nova venda</h1>
<form method="post" action="/vendas/">
  {% csrf_token %}
  <select name="produto">
    {% for produto in produtos %}<option value="{{ produto.pk }}">{{ produto.nome }}</option>{% endfor %}
  </select>
  <input name="quantidade" value="1">
  <select name="forma">
    {% for valor, rotulo in formas %}<option value="{{ valor }}">{{ rotulo }}</option>{% endfor %}
  </select>
  <input name="valor_recebido">
  <button>Confirmar venda</button>
</form>
{% endblock %}
